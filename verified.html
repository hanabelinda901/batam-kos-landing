<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Akun Terverifikasi - Batam Kos App</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #222;
    }

    .card {
      width: 90%;
      max-width: 430px;
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 10px 28px rgba(0,0,0,0.08);
    }

    .icon {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: #1D9E75;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 10px;
    }

    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn {
      display: block;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 12px;
      font-weight: bold;
      margin-top: 12px;
    }

    .btn-primary {
      background: #1D9E75;
      color: white;
    }

    .small {
      margin-top: 20px;
      font-size: 13px;
      color: #999;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>

    <h1>Akun Berhasil Diverifikasi</h1>

    <p>
      Email kamu sudah berhasil diverifikasi.
      Silakan login ke aplikasi Batam Kos App untuk mulai mencari dan booking kos.
    </p>

    <a class="btn btn-primary" href="batamkos://login-callback">
      Buka Aplikasi
    </a>

    <a class="btn btn-outline" href="#">
      Login ke Website
    </a>

    <div class="small">
      Jika aplikasi tidak terbuka, buka Batam Kos App secara manual lalu login.
    </div>
  </div>
</body>
</html>
